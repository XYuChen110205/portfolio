<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="description" content="Seeyu 个人主页">
<title>Seeyu</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="bg-decoration" id="bgDecoration"></div>

<header class="navbar" id="navbar">
  <div class="nav-inner">
    <a href="#home" class="nav-logo">SEE<span>YU</span></a>
    <nav class="nav-links" id="navLinks">
      <a href="#home" class="active" data-section="home" id="navHome">Home</a>
      <a href="#hometown" data-section="hometown" id="navHometown">Hometown</a>
      <a href="#school" data-section="school" id="navSchool">School</a>
      <a href="#challenges" data-section="challenges" id="navChallenges">Challenges</a>
      <a href="#portfolio" data-section="portfolio" id="navPortfolio">Portfolio</a>
      <a href="resources.html" id="navResources">Resources</a>
      <a href="#about" data-section="about" id="navAbout">About</a>
    </nav>
    <div class="nav-actions">
      <div class="lang-switch" id="langSwitch">
        <svg class="lang-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        <select class="lang-select" id="langSelect"><option value="zh">中</option><option value="zh-TW">繁</option><option value="en">EN</option><option value="ja">日</option><option value="ko">?</option><option value="it">IT</option><option value="fr">FR</option></select>
      </div>
      <button class="nav-toggle" id="navToggle">?</button>
      <img src="images/interesting/头像.jpg" class="nav-avatar" alt="Avatar" onerror="this.style.display='none'">
    </div>
  </div>
</header>
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="main-content">

<section class="hero" id="home">
  <div class="hero-video-wrap" id="heroVideoWrap">
    <video id="heroVideo" class="hero-video" muted autoplay loop playsinline preload="metadata">
      <source src="images/bg/背景图书馆门口.mp4" type="video/mp4">
    </video>
    <div class="hero-video-overlay"></div>
    <div class="video-drag-hint">Drag to adjust view</div>
  </div>
  <div class="hero-content">
    <h1 class="hero-name"><span class="grad">&lt;Seeyu/&gt;</span></h1>
  </div>
</section>

<img src="images/项目/小怪兽.jpg" class="hero-mascot" alt="Mascot" onerror="this.style.display='none'">

<section class="section" id="hometown">
  <div class="section-head fade-in stagger">
    <span class="section-num">02</span>
    <h2 class="section-label-en" id="hometownLabel">HOMETOWN</h2>
    <p class="section-label-cn" id="hometownCn">我的家乡</p>
  </div>
  <div class="hometown-showcase fade-in" id="hometownShowcase"></div>
</section>

<section class="section" id="school">
  <div class="section-head fade-in stagger">
    <span class="section-num">03</span>
    <h2 class="section-label-en" id="schoolLabel">ALMA MATER</h2>
    <p class="section-label-cn" id="schoolCn">北部湾大学</p>
  </div>
  <div class="school-lissajous fade-in" id="schoolLissajous"></div>
</section>

<section class="section" id="challenges">
  <div class="section-head fade-in stagger">
    <span class="section-num">04</span>
    <h2 class="section-label-en" id="challengesLabel">CHALLENGES</h2>
    <p class="section-label-cn" id="challengesCn">兴趣与挑战</p>
  </div>
  <div class="ci-layout fade-in" id="ciLayout"></div>
</section>

<section class="section" id="portfolio">
  <div class="section-head fade-in stagger">
    <span class="section-num">05</span>
    <h2 class="section-label-en" id="portfolioLabel">PORTFOLIO</h2>
    <p class="section-label-cn" id="portfolioCn">项目作品集</p>
  </div>
  <div class="projects-grid fade-in stagger" id="featuredProjects"></div>
  <div class="marquee-section fade-in" id="marqueeSection">
    <div class="marquee-track" id="marqueeTrack"></div>
  </div>
</section>

<section class="section" id="about">
  <div class="section-head fade-in stagger">
    <span class="section-num">06</span>
    <h2 class="section-label-en" id="aboutLabel">ABOUT</h2>
    <p class="section-label-cn" id="aboutCn">关于我</p>
  </div>
  <div class="timeline fade-in" id="timeline"></div>
</section>

<section class="section" id="contact">
  <div class="section-head fade-in stagger">
    <span class="section-num">07</span>
    <h2 class="section-label-en" id="contactLabel">CONTACT</h2>
    <p class="section-label-cn" id="contactCn">联系方式</p>
  </div>
  <div class="contact-grid fade-in" id="contactGrid"></div>
</section>

</div>

<footer class="footer">
  <p id="footerText">AI Assisted · Seeyu</p>
</footer>

<div class="lightbox-overlay" id="lightboxOverlay">
  <button class="lightbox-close" id="lightboxClose">&times;</button>
  <img id="lightboxImg" src="" alt="Full view">
</div>

<script src="js/icons.js"></script>
<script src="js/i18n.js"></script>
<script src="js/projects.js"></script>
<script src="js/projects-i18n.js"></script>
<script src="js/main.js"></script>
</body>
</html>
